[package]
name = "f0-supervisor"
description = "Spike F0-06/F0-08: QEMU as a child of the supervisor in a Job Object, crash, Emergency Stop, OS limits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "f0-supervisor"
path = "src/main.rs"

[dependencies]
serde_json = "=1.0.151"
uds_windows = "=1.2.1"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "=0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
]

[lints]
workspace = true
