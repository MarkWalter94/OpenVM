[package]
name = "f0-console"
description = "Spike F0-04: QMP minimo (input, screendump), sonde e misure della console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "f0_console"
path = "src/lib.rs"

[[bin]]
name = "f0-console"
path = "src/main.rs"

# Versioni esatte, nessuna sorgente git (ADR-0023).
[dependencies]
rfb-client = { path = "../../crates/rfb-client" }
serde_json = "=1.0.151"
socket2 = { version = "=0.6.5", features = ["all"] }
png = "=0.18.1"

[target.'cfg(windows)'.dependencies]
uds_windows = "=1.2.1"

[lints]
workspace = true
