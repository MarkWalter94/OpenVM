# LightVM workspace (ROADMAP section 6.2).
# The crates in `crates/` are skeletons: APIs are born in the phases that need them.
# `crates/mcp-server` does not exist yet: it is added in F5.

[workspace]
resolver = "3"
# `spikes/*` contains the F0 feasibility spikes: they are not product code
# and are not part of default-members (build them with `-p <name>`).
members = [
    "apps/desktop",
    "crates/*",
    "spikes/*",
]
default-members = [
    "apps/desktop",
    "crates/*",
]
# Patched copies of dependencies (see `vendor/README.md`): they are not members.
exclude = ["vendor"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

# Exact versions (`=`) for the UI: F0 decision on egui/eframe versions, see
# docs/verification/F0-01-toolchain-eframe.md. No git dependencies.
[workspace.dependencies]
eframe = { version = "=0.36.2", default-features = false }
egui = { version = "=0.36.2", default-features = false }
egui_extras = { version = "=0.36.2", default-features = false }
egui_kittest = { version = "=0.37.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stderr = "allow"
undocumented_unsafe_blocks = "deny"

[profile.release]
# Separate debug symbols remain useful for spike diagnostics.
debug = "line-tables-only"

# F1-13: egui-winit 0.36.2 without reading the host clipboard (patch in
# `vendor/egui-winit`, described in `vendor/README.md`). To be realigned on every
# egui/eframe update (ADR-0014).
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
