# LightVM CI (ROADMAP section 10 F1, section 13 "on every change"; backlog
# F1-02 in docs/RELEASE_PLAN.md; procedure and limits in
# docs/verification/F1-08-ci.md).
#
# What it verifies: formatting, lint (also with a single glow or wgpu backend),
# `--locked` build, headless tests (service IPC, egui_kittest UI tests, MCP
# spike over stdio), accelerator-independent process mechanisms (Job
# Object on Windows; pidfd, groups and cgroup delegation on Linux), software
# rendering (llvmpipe on Xvfb, headless Wayland, WARP), clear message without
# an accelerator (simulated part only), JSON schemas, licences and advisories.
#
# What it does NOT verify: no runner has a verifiable accelerator (WHPX/KVM)
# nor the approved QEMU (ADR-0010). Guest boot, real QMP, real console,
# Emergency Stop on QEMU, resource limits on the QEMU tree and the 20
# start/stop cycles of the F1 exit criterion remain on the controlled physical
# runners (docs/verification/F0-07-linux-kvm.md, "Proposta: CI minima per F1").
# Tests that require a real QEMU are `#[ignore]`.
#
# Runs only when a tag is pushed (owner decision): pushes to branches and pull
# requests do not trigger it; the full check before a commit is
# scripts/regression.ps1 on the developer machine.
#
# No secrets, no lab access: read-only permissions. Only actions pinned to a
# commit SHA; no third-party actions besides checkout and cache (the MSVC
# environment is loaded with vswhere/vcvars64, already present on the Windows
# image).

name: CI

on:
  push:
    tags: ["*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"
  # apt packages (Ubuntu). Build: C compiler for `ring` and bundled SQLite.
  APT_BUILD: build-essential pkg-config
  # Libraries loaded with dlopen by eframe/winit/wgpu (F1-14,
  # docs/verification/F1-07-licences-packaging.md): without libxkbcommon-x11-0
  # the X11 path panics (F0-07, D-17).
  APT_RUNTIME: >-
    libxkbcommon0 libxkbcommon-x11-0
    libwayland-client0 libwayland-cursor0 libwayland-egl1
    libx11-6 libx11-xcb1 libxcursor1 libxrandr2 libxi6 libxcb1
    libegl1 libgl1 libvulkan1
  # Software rendering for the smoke tests: Mesa llvmpipe/lavapipe, Xvfb, Weston.
  APT_SOFTWARE_RENDER: >-
    libegl-mesa0 libgl1-mesa-dri mesa-vulkan-drivers
    xvfb xauth weston

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Lint: formatting and clippy on the workspace and with a single rendering
  # backend (glow or wgpu), to keep the fallbacks compilable (ADR-0014).
  lint:
    name: lint (fmt, clippy, glow/wgpu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --no-self-update
          rustc -Vv
      - name: apt packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_BUILD $APT_RUNTIME
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo clippy (UI glow only)
        run: cargo clippy -p lightvm-desktop --no-default-features --features glow --all-targets --locked -- -D warnings
      - name: cargo clippy (UI wgpu only)
        run: cargo clippy -p lightvm-desktop --no-default-features --features wgpu --all-targets --locked -- -D warnings

  # ---------------------------------------------------------------------------
  # Windows: explicit MSVC environment (F0-01 §4.1, I-7), build, test, kittest.
  build-test-windows:
    name: Windows (MSVC) build and test
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        # pwsh and not bash: in Git Bash `/usr/bin/link` can precede MSVC's
        # link.exe in PATH.
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.*)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --component rustfmt,clippy --no-self-update
          rustc -Vv
      - name: Explicit MSVC environment (vcvars64)
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio with the VC x64 tools not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $vars = cmd /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed: $LASTEXITCODE" }
          $keep = '^(PATH|INCLUDE|LIB|LIBPATH|VCINSTALLDIR|VCToolsInstallDir|VCToolsRedistDir|VCToolsVersion|VSINSTALLDIR|VisualStudioVersion|WindowsSdkDir|WindowsSdkBinPath|WindowsSdkVerBinPath|WindowsSDKLibVersion|WindowsSDKVersion|WindowsLibPath|UCRTVersion|UniversalCRTSdkDir|ExtensionSdkDir|Platform|VSCMD_ARG_[A-Z_]+)='
          foreach ($line in $vars) {
            if ($line -match $keep) { Add-Content -Path $env:GITHUB_ENV -Value $line -Encoding utf8 }
          }
      - name: MSVC linker check
        run: |
          $link = (Get-Command link.exe -ErrorAction Stop).Source
          Write-Output "link.exe: $link"
          if ($link -notmatch '\\VC\\Tools\\MSVC\\') { throw "link.exe is not the MSVC one: $link" }
          Write-Output "LIB=$env:LIB"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows
      - name: cargo clippy (Windows-specific code)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo build --locked
        run: cargo build --workspace --all-targets --locked
      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast
      # Already included above; repeated to get a distinct outcome in the log.
      - name: Headless egui_kittest UI tests (simulated supervisor)
        run: cargo test --locked -p lightvm-desktop --test kittest_ui
      - name: MCP spike over stdio (F1-06)
        run: cargo test --locked -p lightvm-mcp
      - name: cargo build --release (UI)
        run: cargo build --release --locked -p lightvm-desktop

  # Job Object and process supervision on Windows (F0-06, F1-05), without
  # an accelerator. The filters follow the current qemu-backend modules; Job
  # Object tests with real children are to be added here when F1-05 introduces them.
  processes-windows:
    name: Windows processes (Job Object)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.*)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --no-self-update
      - name: Explicit MSVC environment (vcvars64)
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio with the VC x64 tools not found' }
          $vars = cmd /c "`"$(Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat')`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed: $LASTEXITCODE" }
          $keep = '^(PATH|INCLUDE|LIB|LIBPATH|VCINSTALLDIR|VCToolsInstallDir|VCToolsVersion|VSINSTALLDIR|WindowsSdkDir|WindowsSDKLibVersion|WindowsSDKVersion|WindowsLibPath|UCRTVersion|UniversalCRTSdkDir|Platform|VSCMD_ARG_[A-Z_]+)='
          foreach ($line in $vars) {
            if ($line -match $keep) { Add-Content -Path $env:GITHUB_ENV -Value $line -Encoding utf8 }
          }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: processes-windows
      - name: Job Object, quoting, share mode (qemu-backend)
        run: "cargo test --locked -p qemu-backend --lib --no-fail-fast -- sys::windows:: process:: storage_guard::"
      - name: Supervisor, pipe with ACL, parent death (lightvm-service)
        run: cargo test --locked -p lightvm-service --no-fail-fast

  # ---------------------------------------------------------------------------
  # Ubuntu: standard toolchain (not zig as in WSL, F0-07), build and test.
  build-test-linux:
    name: Ubuntu build and test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustc -Vv
      # Mesa (lavapipe) here too: the egui_kittest snapshots use wgpu and the
      # runner has no GPU.
      - name: apt packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_BUILD $APT_RUNTIME $APT_SOFTWARE_RENDER
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux
      - name: cargo build --locked
        run: cargo build --workspace --all-targets --locked
      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast
      - name: Headless egui_kittest UI tests (simulated supervisor)
        run: cargo test --locked -p lightvm-desktop --test kittest_ui
      - name: MCP spike over stdio (F1-06)
        run: cargo test --locked -p lightvm-mcp
      - name: cargo build --release (UI)
        run: cargo build --release --locked -p lightvm-desktop

  # Linux process mechanisms without an accelerator (ADR-0015 part A, F1-15).
  # The cgroup part requires a systemd user session: if missing, the probe
  # prints NOT_RUN and exits 0 (recorded as "not run", not as
  # passed).
  processes-linux:
    name: Linux processes (pidfd, groups, delegated cgroup)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --no-self-update
      - name: apt packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_BUILD
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: processes-linux
      - name: Environment (kernel, cgroup, systemd)
        run: |
          uname -r
          stat -fc %T /sys/fs/cgroup
          cat /sys/fs/cgroup/cgroup.controllers
          systemctl --version | head -1
          ls -l /dev/kvm 2>&1 || true
      - name: Supervisor and parent death with pidfd (lightvm-service)
        run: cargo test --locked -p lightvm-service --no-fail-fast
      # Spike F0 (not product code): PDEATHSIG, pidfd, kill(-pgid), supervisor
      # crash. To be replaced by the real supervisor tests.
      - name: Spike f0-linux-procs processes
        run: cargo run --locked --release -p f0-linux-procs -- processes --samples 10
      # systemd user session: on hosted runners the user manager starts
      # only with linger. `sudo` is only used to prepare the environment; the
      # probe runs without privileges.
      - name: systemd user session (linger)
        run: |
          sudo loginctl enable-linger "$USER" || true
          uid="$(id -u)"
          for _ in $(seq 1 50); do [ -S "/run/user/$uid/bus" ] && break; sleep 0.2; done
          if [ -S "/run/user/$uid/bus" ]; then
            echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
            echo "user bus available"
          else
            echo "::warning::systemd user session not available: cgroup part not run"
          fi
      # Probe F1-15: scope with Delegate=yes created via D-Bus StartTransientUnit
      # (without systemd-run), sub-cgroup for the VM, limits and cgroup.kill.
      # Test children are `sleep`, not QEMU. Same script tried in WSL2
      # (docs/verification/F1-08-ci.md).
      - name: cgroup delegation probe (StartTransientUnit)
        run: |
          set -u
          if ! busctl --user status >/dev/null 2>&1; then
            echo "NOT_RUN: no reachable user bus"
            exit 0
          fi
          sleep 300 & SUP=$!
          sleep 300 & VM=$!
          UNIT="lightvm-probe-$$.scope"
          busctl --user call org.freedesktop.systemd1 /org/freedesktop/systemd1 \
            org.freedesktop.systemd1.Manager StartTransientUnit 'ssa(sv)a(sa(sv))' \
            "$UNIT" fail 3 PIDs au 2 "$SUP" "$VM" Delegate b true Description s "LightVM probe F1-15" 0
          CG=""
          for _ in $(seq 1 50); do
            CG="$(sed -n 's/^0:://p' "/proc/$VM/cgroup")"
            case "$CG" in *"$UNIT") break;; esac
            sleep 0.1
          done
          case "$CG" in *"$UNIT") ;; *) echo "process not moved into the scope: $CG"; exit 1;; esac
          D="/sys/fs/cgroup$CG"
          systemctl --user show -p Delegate -p ActiveState "$UNIT"
          echo "controller: $(cat "$D/cgroup.controllers")"
          mkdir "$D/supervisor" "$D/vm"
          echo "$SUP" > "$D/supervisor/cgroup.procs"
          echo "$VM" > "$D/vm/cgroup.procs"
          echo "+memory +pids +cpu" > "$D/cgroup.subtree_control" || echo "::warning::not all controllers delegated: $(cat "$D/cgroup.controllers")"
          echo "subtree_control: $(cat "$D/cgroup.subtree_control")"
          [ -f "$D/vm/memory.max" ] && echo 64M > "$D/vm/memory.max"
          [ -f "$D/vm/pids.max" ] && echo 16 > "$D/vm/pids.max"
          echo 1 > "$D/vm/cgroup.kill"
          for _ in $(seq 1 500); do grep -q "populated 0" "$D/vm/cgroup.events" && break; sleep 0.002; done
          grep -q "populated 0" "$D/vm/cgroup.events" || { echo "vm/ still populated"; exit 1; }
          if kill -0 "$VM" 2>/dev/null; then echo "fake vm still alive"; exit 1; fi
          kill -0 "$SUP" || { echo "scope lost"; exit 1; }
          rmdir "$D/vm"
          kill "$SUP"
          echo "VERIFIED"
      # Filter reserved for the `#[ignore]` cgroup delegation tests that the
      # supervisor flow will add (name prefixed with `delegated_cgroup`). Today
      # it matches no test: the count makes this visible.
      - name: Ignored cgroup delegation tests (supervisor)
        run: |
          n="$(cargo test --locked --workspace -- --ignored --list delegated_cgroup 2>/dev/null | grep -c ': test$' || true)"
          echo "matching tests: $n"
          if [ "$n" = "0" ]; then
            echo "::warning::no delegated_cgroup tests: supervisor implementation not yet present (F1-15)"
          else
            cargo test --locked --workspace --no-fail-fast -- --ignored delegated_cgroup
          fi

  # ---------------------------------------------------------------------------
  # Software rendering (F1-14, F1-16; ADR-0014): verifies runtime dependencies
  # and the software fallback, does not measure performance. X11 with Xvfb and
  # llvmpipe is blocking; headless Wayland and WARP remain non-blocking until a
  # first run on GitHub confirms they are feasible (F1-08-ci.md).
  smoke-render-software:
    name: software rendering smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x11-llvmpipe
            os: ubuntu-latest
            experimental: false
          - name: linux-wayland-headless
            os: ubuntu-latest
            experimental: true
          - name: windows-warp
            os: windows-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml (Linux)
        if: runner.os == 'Linux'
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --no-self-update
      - name: apt packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_BUILD $APT_RUNTIME $APT_SOFTWARE_RENDER
      - name: Toolchain and MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.*)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --no-self-update
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio with the VC x64 tools not found' }
          $vars = cmd /c "`"$(Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat')`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed: $LASTEXITCODE" }
          $keep = '^(PATH|INCLUDE|LIB|LIBPATH|VCINSTALLDIR|VCToolsInstallDir|VCToolsVersion|VSINSTALLDIR|WindowsSdkDir|WindowsSDKLibVersion|WindowsSDKVersion|WindowsLibPath|UCRTVersion|UniversalCRTSdkDir|Platform|VSCMD_ARG_[A-Z_]+)='
          foreach ($line in $vars) {
            if ($line -match $keep) { Add-Content -Path $env:GITHUB_ENV -Value $line -Encoding utf8 }
          }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: smoke-${{ runner.os }}
      # `--smoke` exists only with the `dev-tools` feature (F6: test and
      # measurement switches are not in the distributed binary).
      - name: UI release build with dev-tools (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release --locked -p lightvm-desktop --features dev-tools
      - name: UI release build with dev-tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release --locked -p lightvm-desktop --features dev-tools
      - name: X11 on Xvfb with llvmpipe (glow, then wgpu on lavapipe)
        if: matrix.name == 'linux-x11-llvmpipe'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WAYLAND_DISPLAY: ""
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" ./target/release/lightvm-desktop --smoke 5 --renderer glow
          xvfb-run -a -s "-screen 0 1280x800x24" ./target/release/lightvm-desktop --smoke 5 --renderer wgpu --wgpu-adapter cpu
      - name: Headless Wayland (Weston) with llvmpipe
        if: matrix.name == 'linux-wayland-headless'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-lightvm --idle-time=0 &
          WESTON=$!
          for _ in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/wayland-lightvm" ] && break; sleep 0.2; done
          unset DISPLAY
          WAYLAND_DISPLAY=wayland-lightvm ./target/release/lightvm-desktop --smoke 5 --renderer glow
          rc=$?
          kill "$WESTON" || true
          exit $rc
      - name: WARP (wgpu on the DX12 software rasterizer)
        if: matrix.name == 'windows-warp'
        shell: pwsh
        run: .\target\release\lightvm-desktop.exe --smoke 5 --renderer warp

  # ---------------------------------------------------------------------------
  # Missing accelerator (F1-03, F1 exit criterion): clear error without a
  # TCG fallback. Only the part without QEMU runs: classification of QEMU's
  # stderr from fixtures (declared mock) and the tests named `missing_accelerator`
  # (today `qemu-backend` `error::tests::missing_accelerator_clear_error`;
  # the variant with a real QEMU is `#[ignore]` and does not run). QEMU is not
  # installed on the runners.
  missing-accelerator:
    name: missing accelerator (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --no-self-update
      - name: apt packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_BUILD
      - name: Explicit MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio with the VC x64 tools not found' }
          $vars = cmd /c "`"$(Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat')`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed: $LASTEXITCODE" }
          $keep = '^(PATH|INCLUDE|LIB|LIBPATH|VCINSTALLDIR|VCToolsInstallDir|VCToolsVersion|VSINSTALLDIR|WindowsSdkDir|WindowsSDKLibVersion|WindowsSDKVersion|WindowsLibPath|UCRTVersion|UniversalCRTSdkDir|Platform|VSCMD_ARG_[A-Z_]+)='
          foreach ($line in $vars) {
            if ($line -match $keep) { Add-Content -Path $env:GITHUB_ENV -Value $line -Encoding utf8 }
          }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: accel-${{ runner.os }}
      # On hosted Ubuntu runners /dev/kvm may exist: the state is only
      # recorded; the real absence is obtained in the F1-03 tests.
      # pwsh on both systems: on Windows it avoids Git Bash's `/usr/bin/link`.
      - name: Accelerator state on the runner
        shell: pwsh
        run: |
          if ($IsLinux) { if (Test-Path /dev/kvm) { Get-Item /dev/kvm | Format-List } else { '/dev/kvm missing' } }
          $q = Get-Command qemu-system-x86_64 -ErrorAction SilentlyContinue
          if ($q) { $q.Source } else { 'QEMU not installed' }
      - name: Classification of the no-accelerator error (fixture, declared mock)
        shell: pwsh
        run: cargo test --locked -p qemu-backend --lib -- probe::tests::stderr_diagnosis --exact
      - name: Capability detection tests (missing_accelerator filter)
        shell: pwsh
        run: |
          $list = cargo test --locked --workspace -- --list missing_accelerator 2>$null
          $n = @($list | Where-Object { $_ -match ': test$' }).Count
          "matching tests: $n"
          if ($n -eq 0) {
            '::warning::no missing_accelerator tests: F1-03 capability detection not yet present'
          } else {
            cargo test --locked --workspace --no-fail-fast -- missing_accelerator
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  # ---------------------------------------------------------------------------
  # The JSON schemas committed in crates/lightvm-proto/schema/ must match
  # those generated from the types (ROADMAP 6.3, 13 "schema validation").
  # Regeneration: LIGHTVM_UPDATE_SCHEMAS=1 cargo test -p lightvm-proto --test schema_snapshot
  schema:
    name: JSON schemas up to date
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: schema
      - name: Schema snapshot
        run: cargo test --locked -p lightvm-proto --test schema_snapshot
      - name: No uncommitted changes to the schemas
        run: git diff --exit-code -- crates/lightvm-proto/schema

  # Licences, RustSec advisories, sources, banned crates and features (deny.toml,
  # ADR-0023; inventory in docs/verification/F1-07-licences-packaging.md).
  cargo-deny:
    name: cargo-deny (licences, advisories, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cargo-deny
      # Same version used locally; installation from crates.io with lockfile,
      # no third-party actions.
      - name: Install cargo-deny 0.20.2
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: cargo deny check
        run: cargo deny --locked check

  # ---------------------------------------------------------------------------
  # macOS portability probe (ROADMAP 10 F1: "build macOS su runner adeguato
  # entro F2 per individuare assunzioni di portabilita', senza dichiarare
  # supporto operativo"). macOS is NOT a supported or verified target: this
  # job only compiles the workspace (all targets, spikes included) to surface
  # Windows/Linux-only assumptions early. `continue-on-error: true` keeps it
  # from blocking CI; a failure, or the runner being unavailable, is recorded
  # as a risk in docs/STATUS.md and never turns macOS into a verified target.
  # Pinned to `macos-14` (Apple silicon, aarch64-apple-darwin) instead of
  # `macos-latest` so the probe does not change under us when the label moves.
  # Evidence: docs/verification/F2-03-packaging-guide-ci.md.
  macos-check:
    name: macOS portability probe (check only, not a supported target)
    runs-on: macos-14
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component clippy --no-self-update
          rustc -Vv
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-14
      - name: cargo check --workspace --all-targets --locked
        run: cargo check --workspace --all-targets --locked
