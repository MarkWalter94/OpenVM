# Dependency updates (ROADMAP 6.3: pinned versions and lockfile;
# ADR-0023). Dependabot PRs go through the same CI without secrets.
# Exact versions (`=`) in the Cargo.toml files are updated by Dependabot
# together with the lockfile; every update remains subject to human review.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # UI: egui/eframe and family are updated together (ADR-0014).
      ui:
        patterns:
          - "egui*"
          - "eframe"
          - "epaint*"
          - "emath"
          - "ecolor"
          - "wgpu*"
          - "winit"
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
