# Configuration of the egui_kittest snapshots (F1-19, ADR-0022 criterion 4).
# egui_kittest looks for this file walking up from the tests' working directory
# (the root of the `apps/desktop` crate).

# Path relative to the crate root.
output_path = "tests/snapshots"

# Weighted, squared YIQ colour distance beyond which a pixel counts as
# different (egui_kittest default value).
threshold = 0.6

# Different pixels allowed before failing. The reference snapshots are
# generated on Windows with WARP (CPU adapter chosen by egui_kittest): on the
# same host the comparison is exact.
max_failed_pixels = 0

# On Linux (llvmpipe) the rasterizer is different: antialiasing of edges and
# glyphs can vary by a few pixels. Declared tolerance, to be confirmed on the
# Linux CI runner (not measured yet: see F1-05).
[linux]
max_failed_pixels = 200
