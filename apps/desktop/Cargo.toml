[package]
name = "lightvm-desktop"
description = "LightVM: interfaccia desktop nativa egui/eframe (spike F0)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "lightvm-desktop"
path = "src/main.rs"

[features]
# Backend di rendering (ADR-0014, F1-16): la build predefinita include glow e
# wgpu, così la selezione automatica può ripiegare glow → wgpu (DX12 su
# hardware) → wgpu su rasterizzatore software (WARP). Con un solo backend
# compilato (`--no-default-features --features glow|wgpu`) il ripiego si
# limita ai tentativi disponibili.
default = ["wgpu", "glow"]
wgpu = ["eframe/wgpu"]
glow = ["eframe/glow"]

[dependencies]
# `links` (apertura automatica di URL) è escluso di proposito: ROADMAP 6.0 vieta
# link apribili automaticamente. `persistence` non serve allo spike.
# Nota F1-13: eframe 0.36.2 abilita sempre `egui-winit/clipboard` sui target
# nativi (dipendenza non opzionale nel suo Cargo.toml), quindi la lettura degli
# appunti host non si può disattivare dalle feature: vedi `src/appunti.rs`.
eframe = { workspace = true, features = ["accesskit", "default_fonts", "wayland", "x11"] }
egui = { workspace = true, features = ["default_fonts"] }
egui_extras = { workspace = true }
# Console reale F0-04: client RFB in sola lettura e QMP dello spike.
rfb-client = { path = "../../crates/rfb-client" }
f0-console = { path = "../../spikes/f0-console" }
# Supervisor come processo figlio e IPC (F1-11): solo il lato client del
# servizio, senza `qemu-backend` (ADR-0024).
lightvm-proto = { path = "../../crates/lightvm-proto" }
lightvm-service = { path = "../../crates/lightvm-service", default-features = false }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
# `snapshot` + `wgpu`: istantanee grafiche confrontate con i file in
# `tests/snapshots/` (F1-19, ADR-0022); tolleranza in `kittest.toml`.
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }

[lints]
workspace = true
