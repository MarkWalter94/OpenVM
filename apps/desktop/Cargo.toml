[package]
name = "lightvm-desktop"
description = "LightVM: interfaccia desktop nativa egui/eframe (spike F0)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "lightvm-desktop"
path = "src/main.rs"

[features]
# Backend di rendering: wgpu predefinito, glow opzionale. Se entrambi sono
# attivi si sceglie a runtime con `--renderer wgpu|glow`.
default = ["wgpu"]
wgpu = ["eframe/wgpu"]
glow = ["eframe/glow"]

[dependencies]
# `links` (apertura automatica di URL) è escluso di proposito: ROADMAP 6.0 vieta
# link apribili automaticamente. `persistence` non serve allo spike.
eframe = { workspace = true, features = ["accesskit", "default_fonts", "wayland", "x11"] }
egui = { workspace = true, features = ["default_fonts"] }
egui_extras = { workspace = true }
# Console reale F0-04: client RFB in sola lettura e QMP dello spike.
rfb-client = { path = "../../crates/rfb-client" }
f0-console = { path = "../../spikes/f0-console" }

[dev-dependencies]
egui_kittest = { workspace = true }

[lints]
workspace = true
