# Pinned toolchain for the LightVM workspace (F0, step 1).
# Stable channel, exact version. The host triple is not pinned here so as not
# to constrain the Linux build: rustup uses the configured "default host".
# On the F0 host the default host is x86_64-pc-windows-msvc, so this file
# selects 1.99.0-x86_64-pc-windows-msvc (not the user's default GNU
# toolchain). Details and MSVC linker requirements in
# docs/verification/F0-01-toolchain-eframe.md.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
