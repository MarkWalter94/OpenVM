# cargo-deny: licences, advisories, sources and duplicates (ROADMAP 6.0, 6.3; ADR-0023).
# Run in CI (job `cargo-deny` in .github/workflows/ci.yml) and locally with
# `cargo deny --locked check`. Inventory and rationale:
# docs/verification/F1-07-licences-packaging.md (the first check is in
# docs/verification/F1-04-service-ipc-ci.md). The tool does not replace human
# review of non-standard licences (ADR-0023).

[graph]
# Declared or observed targets (macOS for portability only).
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# RustSec database; no exceptions. A vulnerable version is not frozen
# to comply with the text (ROADMAP 17).
ignore = []

[licenses]
# Only permissive licences compatible with MIT distribution of the binary.
# Everything not listed is denied: in particular GPL, LGPL, AGPL, MPL,
# EPL, CDDL, SSPL, "source available" licences and unknown licences.
# `OR` expressions with a copyleft option (for example `self_cell`:
# `Apache-2.0 OR GPL-2.0-only`) pass because the permissive branch is used.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# Fonts embedded by egui: font-specific licences, allowed only for
# this crate. Texts to include in the third-party inventory (F6).
exceptions = [
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[licenses.private]
# Workspace crates have `publish = false` and the MIT licence.
ignore = true
registries = []

[bans]
# Duplicates reported, not blocking: they come from eframe/wgpu dependencies.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-wildcard-paths = true
# Offline profile (ADR-0004) and build without external tools: no HTTP
# client, no system TLS stack, no crypto provider that requires
# CMake/NASM (rfb-client uses `ring`, F0-04).
deny = [
    { crate = "reqwest", reason = "no HTTP client in the offline MVP product (ADR-0004)" },
    { crate = "hyper", reason = "no HTTP stack in the offline MVP product (ADR-0004)" },
    { crate = "oauth2", reason = "MCP over stdio without HTTP OAuth (ROADMAP 9)" },
    { crate = "openssl-sys", reason = "TLS only through rustls (ADR-0013)" },
    { crate = "native-tls", reason = "TLS only through rustls (ADR-0013)" },
    { crate = "aws-lc-sys", reason = "requires CMake/NASM on the build host (F0-04)" },
]
# MCP SDK (ADR-0021): stdio server only. HTTP transport, OAuth and client
# features are denied even if a dependency were to enable them in the future.
features = [
    { crate = "rmcp", deny = [
        "auth",
        "auth-client-credentials-jwt",
        "auth-enterprise-managed",
        "client-side-sse",
        "reqwest",
        "reqwest-native-tls",
        "reqwest-tls-no-provider",
        "server-side-http",
        "transport-streamable-http-client",
        "transport-streamable-http-client-reqwest",
        "transport-streamable-http-client-unix-socket",
        "transport-streamable-http-server",
        "transport-streamable-http-server-session",
    ] },
]

[sources]
# crates.io only; no git dependencies or alternative registries (ROADMAP 6.3).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
