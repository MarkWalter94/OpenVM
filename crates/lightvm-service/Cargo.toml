[package]
name = "lightvm-service"
description = "LightVM: supervisor, authenticated local IPC and composition root (F1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

# Supervisor binary, started by the UI as a child process (ROADMAP 6.1).
[[bin]]
name = "lightvm-service"
path = "src/main.rs"
required-features = ["supervisor"]

# Minimal test client: used by the tests and by the low-integrity check
# (docs/verification/F1-04-service-ipc-ci.md). Not a product artifact.
[[bin]]
name = "lightvm-ipc-probe"
path = "src/bin/lightvm-ipc-probe.rs"

# `supervisor` (default): composition root, IPC server and real adapters.
# Without it the crate exposes only the client side (`client`, `credential`,
# `frame`, `transport`): the UI uses it with `default-features = false`, so
# `qemu-backend` stays in the supervisor only (ADR-0024).
[features]
default = ["supervisor"]
supervisor = ["dep:guest-detect", "dep:lightvm-fixture", "dep:png", "dep:qemu-backend", "dep:sha2", "dep:socket2", "dep:vm-core", "dep:vm-storage"]

# Exact versions and lockfile (ROADMAP 6.3); no git dependencies.
[dependencies]
getrandom = { version = "=0.4.3", features = ["std"] }
# Guest OS detection on the managed copy of an installation ISO at import
# (ADR-0027).
guest-detect = { path = "../guest-detect", optional = true }
lightvm-proto = { path = "../lightvm-proto" }
# F5: ADR-0019 pixel verifier run on the stored screenshots of a session
# report (`verify_session`), and PNG decoding for it (same version as
# qemu-backend).
lightvm-fixture = { path = "../lightvm-fixture", optional = true }
png = { version = "=0.18.1", optional = true }
# Composition root (ROADMAP 6.1): real core, SQLite catalog and QEMU backend.
qemu-backend = { path = "../qemu-backend", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# SHA-256 of agent screenshots, checked against the backend metadata (F4).
sha2 = { version = "=0.11.0", optional = true }
# AF_UNIX display proxy (ADR-0013), same crate and version as qemu-backend.
socket2 = { version = "=0.6.5", features = ["all"], optional = true }
tokio = { version = "=1.53.2", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
vm-core = { path = "../vm-core", optional = true }
vm-storage = { path = "../vm-storage", optional = true }

# Named pipe with a security descriptor through safe APIs (no `unsafe` in the
# crate): `interprocess` wraps CreateNamedPipeW and the SDDL conversion;
# `sysinfo` reads the user SID of a process (our own and the peer's).
[target.'cfg(windows)'.dependencies]
interprocess = { version = "=2.4.4", features = ["tokio"] }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
widestring = "=1.2.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["event", "process"] }

[dev-dependencies]
# Synthetic Windows / Linux installation images for the import tests.
guest-detect = { path = "../guest-detect", features = ["test-images"] }
# End-to-end console test through the display ticket (tests only).
rfb-client = { path = "../rfb-client" }
tokio = { version = "=1.53.2", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true

# The integration tests start the service: they require the supervisor.
[[test]]
name = "ipc"
required-features = ["supervisor"]

[[test]]
name = "core_path"
required-features = ["supervisor"]

[[test]]
name = "f2"
required-features = ["supervisor"]

[[test]]
name = "f3"
required-features = ["supervisor"]

[[test]]
name = "f3_real"
required-features = ["supervisor"]

[[test]]
name = "f4"
required-features = ["supervisor"]

[[test]]
name = "f4_real"
required-features = ["supervisor"]

[[test]]
name = "f5_reports"
required-features = ["supervisor"]

[[test]]
name = "windows_guests"
required-features = ["supervisor"]

[[test]]
name = "windows_real"
required-features = ["supervisor"]
