[package]
name = "vm-storage"
description = "LightVM: catalogo SQLite, migrazioni, manifest, journal e riconciliazione"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Versioni esatte e nessuna dipendenza git (ROADMAP 6.3, ADR-0023).
# `rusqlite` con `bundled`: SQLite compilato nel binario, nessuna DLL di sistema.
[dependencies]
lightvm-proto = { path = "../lightvm-proto" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.21"
uuid = { version = "=1.27.0", features = ["v7", "std"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
