[package]
name = "vmware-import"
description = "LightVM: examination of VMware VMs (.vmx, VMDK descriptors) for import by conversion (ADR-0030)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Bounded readers of untrusted VMware files: the `.vmx` and the VMDK
# descriptors (text, or embedded in a sparse extent) are parsed with size
# and count limits, only known keys are kept and no value reaches QEMU; the
# files referenced by a disk (extents, snapshot parents) must be regular
# files inside the VM folder. `serde_json` reads the output of
# `qemu-img info --output=json` (same version as the rest of the workspace,
# ADR-0023).
[dependencies]
lightvm-proto = { path = "../lightvm-proto" }
serde_json = "=1.0.151"

[dev-dependencies]
proptest = "=1.11.0"

[lints]
workspace = true
