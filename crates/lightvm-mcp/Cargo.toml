[package]
name = "lightvm-mcp"
description = "LightVM: F1-19 spike of the MCP SDK (rmcp) with stdio transport and fake tools; not the product adapter (F5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# SDK selection spike (ADR-0021, docs/verification/F1-06-mcp-sdk.md).
# The product crate `mcp-server` is born in F5 (ROADMAP 6.2): this crate only
# serves to try the SDK with MCP revision 2025-11-25 over stdio.

[lib]
path = "src/lib.rs"

[[bin]]
name = "lightvm-mcp-spike"
path = "src/main.rs"

# Exact versions (`=`), no git dependencies, no network features:
# no HTTP, no OAuth, no client-side child process.
[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["io-std", "macros", "rt"] }

[lints]
workspace = true
