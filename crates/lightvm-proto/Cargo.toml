[package]
name = "lightvm-proto"
description = "LightVM: shared IPC/MCP types and JSON Schemas generated from a single source (F1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["system-clock"]
# Generation of UUID v7 identifiers from the system clock and the operating
# system's random generator. Used by the supervisor; `vm-core` does not need it
# (it receives identifiers through the `IdGenerator` port).
system-clock = ["uuid/v7", "uuid/std"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
# Exact version: the shape of the generated schemas depends on the schemars version
# and the schemas committed in `schema/` are compared in a snapshot test.
schemars = { version = "=1.2.3", default-features = false, features = ["derive", "std"] }
serde_json = "1.0.150"
uuid = { version = "1.27.0", default-features = false, features = ["serde"] }
jiff = { version = "0.2.24", default-features = false, features = ["std"] }

[dev-dependencies]
proptest = "1.11.0"

[lints]
workspace = true
