[package]
name = "rfb-client"
description = "LightVM: minimal read-only RFB 3.8 client for the console (spike F0-04)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Dependencies with exact versions and no git sources (ADR-0023).
# They are declared here and not in [workspace.dependencies] so as not to modify the
# root Cargo.toml during F0.
[dependencies]
# ZRLE: persistent zlib stream per connection. Pure Rust backend (miniz_oxide).
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# AF_UNIX sockets (Windows too) and TCP for VeNCrypt.
socket2 = { version = "=0.6.5", features = ["all"] }
# TLS for VeNCrypt X.509 with a client certificate. `ring` provider: aws-lc-rs
# would require CMake/NASM on the build host.
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(windows)'.dependencies]
# Alternative AF_UNIX implementation, tested against socket2 in F0-04.
uds_windows = "=1.2.1"

[lints]
workspace = true
