[package]
name = "qemu-backend"
description = "LightVM: capability probe, controlled QEMU command, QMP client and QEMU process management"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Exact versions, no git sources (ADR-0023). The versions match
# those already present in the workspace lockfile (spikes F0-04/F0-06).
[dependencies]
# Shared types (identifiers, typed input, public errors, observations).
lightvm-proto = { path = "../lightvm-proto" }
png = "=0.18.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
socket2 = { version = "=0.6.5", features = ["all"] }
tokio = { version = "=1.54.1", default-features = false, features = ["sync", "time", "rt"] }

# The Win32 APIs for Job Objects, `CreateProcessW` with handle/job lists and
# process identity have no equivalent safe wrappers in the standard
# library: the `unsafe` code is confined to `src/sys/windows.rs` (see lib.rs).
[target.'cfg(windows)'.dependencies.windows-sys]
version = "=0.61.2"
features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
]

# Unix (macOS, Linux): file system and process calls without `unsafe`
# (same version as lightvm-service).
[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }

[dev-dependencies]
proptest = "=1.12.0"
tokio = { version = "=1.54.1", default-features = false, features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
