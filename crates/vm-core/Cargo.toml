[package]
name = "vm-core"
description = "LightVM: use cases, state machine, per-VM queue, policy and sessions without I/O (F1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
